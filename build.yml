name: Compilar FiskLiveREPO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore FiskLiveREPO.csproj

      - name: Build
        run: dotnet build FiskLiveREPO.csproj -c Release -o build_output

      - name: Verify DLL exists
        shell: pwsh
        run: |
          if (!(Test-Path "build_output/FiskLiveREPO.dll")) {
            Write-Error "No se genero FiskLiveREPO.dll"
            exit 1
          }
          Write-Host "FiskLiveREPO.dll generado correctamente"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FiskLiveREPO
          path: build_output/FiskLiveREPO.dll
